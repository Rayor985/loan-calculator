<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贷款计算器 - 等额本息还款</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --color-bg: #fafafa;
      --color-surface: #ffffff;
      --color-border: #e5e5e5;
      --color-text: #1a1a1a;
      --color-text-secondary: #555555;
      --color-text-muted: #777777;
      --color-accent: #a30030;
      --color-accent-hover: #8a0029;
      --color-accent-light: #fdf2f4;
      --color-info-bg: #f0f4f8;
      --color-info-border: #d0d7de;
      --color-info-text: #3d444d;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.08);
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      --space-2xl: 48px;
    }

    html, body {
      overflow-x: hidden;
      max-width: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    .header {
      background: var(--color-accent);
      color: #fff;
      padding: var(--space-xl) 0;
      text-align: center;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 700;
    }
    .header p {
      font-size: 15px;
      margin-top: var(--space-sm);
      opacity: 0.9;
    }

    /* Container */
    .container {
      max-width: 880px;
      margin: 0 auto;
      padding: var(--space-xl) var(--space-md) var(--space-2xl);
    }

    /* Card */
    .card {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: var(--space-xl);
      margin-bottom: var(--space-lg);
    }
    .card-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--color-text);
      margin-bottom: var(--space-lg);
      padding-bottom: var(--space-md);
      border-bottom: 1px solid var(--color-border);
    }

    /* Form */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-lg) var(--space-xl);
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }
    .form-group.full-width {
      grid-column: 1 / -1;
    }
    .form-group label {
      font-size: 14px;
      color: var(--color-text-secondary);
      font-weight: 500;
    }
    .input-wrapper {
      display: flex;
      align-items: center;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      overflow: hidden;
      transition: border-color 0.15s, box-shadow 0.15s;
      background: var(--color-surface);
    }
    .input-wrapper:focus-within {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px rgba(163, 0, 48, 0.06);
    }
    .input-wrapper input {
      flex: 1;
      border: none;
      outline: none;
      padding: 12px 14px;
      font-size: 16px;
      background: transparent;
      color: var(--color-text);
    }
    .input-wrapper input::placeholder {
      color: #999;
    }
    .input-wrapper .unit {
      padding: 0 14px;
      font-size: 14px;
      color: var(--color-text-muted);
      background: #f5f5f5;
      height: 100%;
      display: flex;
      align-items: center;
      border-left: 1px solid var(--color-border);
      white-space: nowrap;
      min-height: 46px;
    }

    /* Select */
    .input-wrapper select {
      flex: 1;
      border: none;
      outline: none;
      padding: 12px 14px;
      font-size: 16px;
      background: transparent;
      color: var(--color-text);
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }

    /* Button */
    .btn-row {
      margin-top: var(--space-xl);
      display: flex;
      gap: var(--space-md);
    }
    .btn {
      padding: 14px 40px;
      border: none;
      border-radius: var(--radius-md);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-primary {
      background: var(--color-accent);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--color-accent-hover);
    }
    .btn-primary:active {
      transform: scale(0.98);
    }
    .btn-secondary {
      background: #f0f0f0;
      color: var(--color-text-secondary);
    }
    .btn-secondary:hover {
      background: #e4e4e4;
    }

    /* Results */
    .results {
      display: none;
    }
    .results.show {
      display: block;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Summary cards */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-md);
      margin-bottom: var(--space-xl);
    }
    .summary-item {
      text-align: center;
      padding: var(--space-lg) var(--space-md);
      border-radius: var(--radius-md);
      background: var(--color-accent-light);
      border: 1px solid #f0d4d9;
    }
    .summary-item .label {
      font-size: 14px;
      color: var(--color-text-muted);
      margin-bottom: var(--space-sm);
    }
    .summary-item .value {
      font-size: 26px;
      font-weight: 700;
      color: var(--color-accent);
    }
    .summary-item .value .currency {
      font-size: 14px;
      font-weight: 400;
      color: var(--color-text-muted);
      margin-left: 2px;
    }

    /* Table */
    .table-wrapper {
      max-height: 480px;
      overflow-y: auto;
      overflow-x: auto;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      -webkit-overflow-scrolling: touch;
    }
    .table-wrapper::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .table-wrapper::-webkit-scrollbar-track {
      background: #f5f5f5;
    }
    .table-wrapper::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 3px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      table-layout: fixed;
    }
    thead {
      position: sticky;
      top: 0;
      z-index: 1;
    }
    thead th {
      background: var(--color-accent);
      color: #fff;
      padding: 12px 8px;
      font-weight: 500;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    thead th:first-child {
      text-align: center;
      width: 60px;
    }
    tbody td {
      padding: 10px 8px;
      text-align: right;
      border-bottom: 1px solid #f0f0f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    tbody td:first-child {
      text-align: center;
      color: var(--color-text-muted);
      font-size: 13px;
    }
    tbody tr:hover {
      background: #fafafa;
    }
    tbody tr:nth-child(even) {
      background: #fafafa;
    }
    tbody tr:nth-child(even):hover {
      background: #f5f5f5;
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: var(--space-lg);
      font-size: 14px;
      color: var(--color-text-muted);
    }

    /* Responsive */
    @media (max-width: 640px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
      .form-group {
        min-width: 0;
      }
      .summary-grid {
        grid-template-columns: 1fr;
      }
      .summary-item {
        min-width: 0;
      }
      .summary-item .value {
        font-size: 22px;
      }
      .btn-row {
        flex-direction: column;
      }
      .btn {
        width: 100%;
      }
      .container {
        padding: var(--space-lg) 12px var(--space-xl);
      }
      .card {
        padding: var(--space-lg) 16px;
      }
      .header h1 {
        font-size: 24px;
      }
      .header p {
        font-size: 14px;
      }
      .card-title {
        font-size: 16px;
      }
      .input-wrapper input,
      .input-wrapper select {
        font-size: 16px;
        padding: 10px 12px;
      }
      .input-wrapper .unit {
        padding: 0 10px;
        font-size: 13px;
      }
      table {
        font-size: 13px;
      }
      thead th {
        padding: 10px 6px;
        font-size: 13px;
      }
      tbody td {
        padding: 8px 6px;
        font-size: 13px;
      }
      .tip {
        font-size: 13px;
        padding: var(--space-md);
      }
    }

    /* Tip */
    .tip {
      margin-top: var(--space-lg);
      padding: var(--space-md) var(--space-lg);
      background: var(--color-info-bg);
      border: 1px solid var(--color-info-border);
      border-radius: var(--radius-md);
      font-size: 14px;
      color: var(--color-info-text);
      line-height: 1.7;
    }
    .tip strong {
      color: var(--color-accent);
    }
  </style>
</head>
<body>

<div class="header">
  <h1>车贷计算器</h1>
  <p>等额本息还款 · 车贷计算</p>
</div>

<div class="container">
<!-- Input Card -->
<div class="card">
  <div class="card-title">贷款参数设置</div>
  <div class="form-grid">
    <div class="form-group">
      <label>贷款金额</label>
      <div class="input-wrapper">
        <input type="text" id="loanAmount" placeholder="请输入贷款金额" value="10">
        <span class="unit">万元</span>
      </div>
    </div>
    <div class="form-group">
      <label>贷款期限</label>
      <div class="input-wrapper">
        <input type="text" id="loanMonths" placeholder="1-360" value="36" oninput="syncPrepayMonths()">
        <span class="unit">月</span>
      </div>
    </div>
    <div class="form-group">
      <label>贷款年利率</label>
      <div class="input-wrapper">
        <input type="text" id="annualRate" placeholder="请输入年利率" value="3.5">
        <span class="unit">%</span>
      </div>
    </div>
    <div class="form-group">
      <label>提前还款月数</label>
      <div class="input-wrapper">
        <input type="text" id="prepayMonths" placeholder="可选，多少个月后提前还" value="36">
        <span class="unit">月</span>
      </div>
    </div>
    <div class="form-group">
      <label>还款方式</label>
      <div class="input-wrapper">
        <select id="repayType">
          <option value="debx" selected>等额本息还款</option>
          <option value="debj">等额本金还款</option>
        </select>
      </div>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="calculate()">开始计算</button>
    <button class="btn btn-secondary" onclick="resetForm()">重新填写</button>
  </div>
</div>

  <!-- Results Card -->
  <div class="card results" id="resultsCard">
    <div class="card-title">计算结果</div>

    <div class="summary-grid">
      <div class="summary-item">
        <div class="label" id="monthlyLabel">每月月供</div>
        <div class="value" id="monthlyPayment">-</div>
      </div>
      <div class="summary-item">
        <div class="label">已还款总额</div>
        <div class="value" id="totalPayment">-</div>
      </div>
      <div class="summary-item">
        <div class="label">已还利息总额</div>
        <div class="value" id="totalInterest">-</div>
      </div>
      <div class="summary-item" style="grid-column: span 3; background: #fff0f0;">
        <div class="label">剩余本金</div>
        <div class="value" id="remainingPrincipal">-</div>
      </div>
    </div>

    <div class="card-title" style="margin-top:8px;">还款明细表</div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>期数</th>
            <th id="thMonthly">月供金额</th>
            <th>月供本金</th>
            <th>月供利息</th>
            <th>剩余本金</th>
          </tr>
        </thead>
        <tbody id="scheduleBody"></tbody>
      </table>
    </div>

    <div class="tip">
      <strong>【温馨提示】</strong>以上计算结果仅供参考，具体以办理业务或交易实际结果为准，据此投资风险自负。
    </div>
  </div>
</div>

<div class="footer">
  贷款计算器 · 数据仅供参考
</div>

<script>
// Format number with commas
function formatMoney(n) {
  return n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

// Format for summary (larger numbers, show wan)
function formatSummary(n) {
  if (n >= 10000) {
    return formatMoney(n) + '<span class="currency"> 元</span>';
  }
  return formatMoney(n) + '<span class="currency"> 元</span>';
}

// Validate inputs
function validate(amount, months, rate) {
  if (isNaN(amount) || amount <= 0) {
    alert('请输入有效的贷款金额'); return false;
  }
  if (isNaN(months) || months < 1 || months > 360 || months !== Math.floor(months)) {
    alert('贷款期限请输入1-360的整数'); return false;
  }
  if (isNaN(rate) || rate <= 0 || rate > 100) {
    alert('请输入有效的年利率'); return false;
  }
  return true;
}

// 等额本息 calculation
function calcDEBX(principal, months, monthlyRate) {
  if (monthlyRate === 0) {
    const mp = principal / months;
    const schedule = [];
    let remaining = principal;
    for (let i = 1; i <= months; i++) {
      const pPart = mp;
      const iPart = 0;
      remaining -= pPart;
      schedule.push({ period: i, payment: mp, principal: pPart, interest: iPart, remaining: Math.max(0, remaining) });
    }
    return { monthlyPayment: mp, totalPayment: principal, totalInterest: 0, schedule };
  }
  const factor = Math.pow(1 + monthlyRate, months);
  const mp = principal * monthlyRate * factor / (factor - 1);
  const totalPayment = mp * months;
  const totalInterest = totalPayment - principal;

  const schedule = [];
  let remaining = principal;
  for (let i = 1; i <= months; i++) {
    const iPart = remaining * monthlyRate;
    const pPart = mp - iPart;
    remaining -= pPart;
    schedule.push({
      period: i,
      payment: mp,
      principal: pPart,
      interest: iPart,
      remaining: Math.max(0, remaining)
    });
  }
  return { monthlyPayment: mp, totalPayment, totalInterest, schedule };
}

// 等额本金 calculation
function calcDEBJ(principal, months, monthlyRate) {
  const monthlyPrincipal = principal / months;
  const schedule = [];
  let remaining = principal;
  let totalPayment = 0;
  let totalInterest = 0;

  for (let i = 1; i <= months; i++) {
    const iPart = remaining * monthlyRate;
    const mp = monthlyPrincipal + iPart;
    remaining -= monthlyPrincipal;
    totalPayment += mp;
    totalInterest += iPart;
    schedule.push({
      period: i,
      payment: mp,
      principal: monthlyPrincipal,
      interest: iPart,
      remaining: Math.max(0, remaining)
    });
  }
  // First month payment as the "monthly payment" display
  return { monthlyPayment: schedule[0].payment, totalPayment, totalInterest, schedule, firstMonth: schedule[0].payment, lastMonth: schedule[schedule.length - 1].payment };
}

function calculate() {
  const amount = parseFloat(document.getElementById('loanAmount').value.replace(/,/g, '')) * 10000;
  const months = parseInt(document.getElementById('loanMonths').value);
  const rate = parseFloat(document.getElementById('annualRate').value);
  const prepay = parseInt(document.getElementById('prepayMonths').value);
  const type = document.getElementById('repayType').value;

  if (!validate(amount / 10000, months, rate)) return;

  const monthlyRate = rate / 100 / 12;
  let result;

  if (type === 'debx') {
    result = calcDEBX(amount, months, monthlyRate);
    document.getElementById('monthlyLabel').textContent = '每月月供';
    document.getElementById('monthlyPayment').innerHTML = formatSummary(result.monthlyPayment);
    document.getElementById('thMonthly').textContent = '月供金额';
  } else {
    result = calcDEBJ(amount, months, monthlyRate);
    document.getElementById('monthlyLabel').textContent = '首月月供';
    document.getElementById('monthlyPayment').innerHTML =
      formatSummary(result.firstMonth) +
      '<div style="font-size:12px;color:#999;margin-top:4px;font-weight:400;">末月 ' + formatMoney(result.lastMonth) + ' 元</div>';
    document.getElementById('thMonthly').textContent = '月供金额';
  }

  // Handle提前还款
  let pIdx = Math.min(prepay, result.schedule.length);
  let paidTotal = 0;
  let paidInterest = 0;
  for(let i=0; i<pIdx; i++) {
    paidTotal += result.schedule[i].payment;
    paidInterest += result.schedule[i].interest;
  }
  let remaining = result.schedule[pIdx-1] ? result.schedule[pIdx-1].remaining : amount;

  document.getElementById('totalPayment').innerHTML = formatSummary(paidTotal);
  document.getElementById('totalInterest').innerHTML = formatSummary(paidInterest);
  document.getElementById('remainingPrincipal').innerHTML = formatSummary(remaining);

  // Build table
  const tbody = document.getElementById('scheduleBody');
  tbody.innerHTML = '';
  result.schedule.forEach(row => {
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td>' + row.period + '</td>' +
      '<td>' + formatMoney(row.payment) + '</td>' +
      '<td>' + formatMoney(row.principal) + '</td>' +
      '<td>' + formatMoney(row.interest) + '</td>' +
      '<td>' + formatMoney(row.remaining) + '</td>';
    tbody.appendChild(tr);
  });

  // Show results
  document.getElementById('resultsCard').classList.add('show');
  document.getElementById('resultsCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function resetForm() {
  document.getElementById('loanAmount').value = '';
  document.getElementById('loanMonths').value = '';
  document.getElementById('annualRate').value = '';
  document.getElementById('repayType').value = 'debx';
  document.getElementById('resultsCard').classList.remove('show');
  document.getElementById('loanAmount').focus();
}

// Auto-format amount on blur
document.getElementById('loanAmount').addEventListener('blur', function() {
  const v = parseFloat(this.value.replace(/,/g, ''));
  if (!isNaN(v) && v > 0) {
    this.value = v.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }
});

// Sync loan duration with prepay duration
function syncPrepayMonths() {
  const loanMonths = document.getElementById('loanMonths').value;
  document.getElementById('prepayMonths').value = loanMonths;
}

// Enter key triggers calculation
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') calculate();
});
</script>

</body>
</html>

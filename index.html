<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>车贷计算器 · 等额本息还款</title>
  <style>
    /* ============================================================
       Design System: Stripe
       Source: nexu-io/open-design → design-systems/stripe (Apache-2.0)
       - Weight 300 headlines, deep navy (#061b31) instead of black
       - Blue-tinted multi-layer shadows rgba(50,50,93,.25)
       - Conservative radii 4–8px, never pills
       - "tnum" tabular numerals for every financial figure
       - Zero-slop: no gradients, no glow, no colored box-shadows
       ============================================================ */

    :root {
      /* Color */
      --color-bg: #ffffff;
      --color-surface: #ffffff;
      --color-surface-alt: #f6f9fc;
      --color-heading: #061b31;
      --color-label: #273951;
      --color-body: #64748d;
      --color-border: #e5edf5;
      --color-border-strong: #d4dee9;
      --color-accent: #533afd;
      --color-accent-hover: #4434d4;
      --color-accent-soft: #b9b9f9;
      --color-accent-wash: rgba(83, 58, 253, 0.05);

      /* Radius — Stripe stays in the 4–8px band */
      --radius-sm: 4px;
      --radius-md: 5px;
      --radius-lg: 6px;
      --radius-xl: 8px;

      /* Elevation — chromatic depth, blue-tinted */
      --shadow-standard: rgba(23, 23, 23, 0.08) 0px 15px 35px 0px;
      --shadow-elevated: rgba(50, 50, 93, 0.25) 0px 30px 45px -30px,
                         rgba(0, 0, 0, 0.1) 0px 18px 36px -18px;
      --focus-ring: 0 0 0 2px #533afd;

      /* Spacing — dense at the small end */
      --space-1: 4px;
      --space-2: 6px;
      --space-3: 8px;
      --space-4: 12px;
      --space-5: 16px;
      --space-6: 20px;
      --space-8: 32px;
      --space-12: 48px;

      --container-max: 1080px;

      --font-sans: "SF Pro Display", -apple-system, BlinkMacSystemFont,
                   "Segoe UI", "PingFang SC", "Hiragino Sans GB",
                   "Microsoft YaHei", sans-serif;
      --font-mono: "SourceCodePro", "SFMono-Regular", "SF Mono",
                   Menlo, Consolas, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      overflow-x: hidden;
      max-width: 100%;
    }

    body {
      font-family: var(--font-sans);
      font-feature-settings: "ss01";
      background: var(--color-bg);
      color: var(--color-body);
      min-height: 100vh;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ---------- Navigation ---------- */
    .nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--color-border);
    }
    .nav-inner {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: var(--space-4) var(--space-6);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-5);
    }
    .nav-brand {
      display: flex;
      align-items: baseline;
      gap: var(--space-3);
      min-width: 0;
    }
    .nav-brand .mark {
      font-size: 16px;
      font-weight: 400;
      color: var(--color-heading);
      letter-spacing: -0.2px;
      white-space: nowrap;
    }
    .nav-brand .sub {
      font-size: 12px;
      font-weight: 300;
      color: var(--color-body);
      white-space: nowrap;
    }
    .nav-tag {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--color-accent);
      background: var(--color-accent-wash);
      border: 1px solid var(--color-accent-soft);
      border-radius: var(--radius-sm);
      padding: 2px 6px;
      white-space: nowrap;
    }

    /* ---------- Hero ---------- */
    .hero {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: var(--space-12) var(--space-6) var(--space-8);
      text-align: center;
    }
    .hero h1 {
      font-size: 48px;
      font-weight: 300;
      line-height: 1.15;
      letter-spacing: -0.96px;
      color: var(--color-heading);
      margin-bottom: var(--space-4);
    }
    .hero p {
      font-size: 18px;
      font-weight: 300;
      line-height: 1.4;
      color: var(--color-body);
      max-width: 36em;
      margin: 0 auto;
    }

    /* ---------- Container ---------- */
    .container {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 0 var(--space-6) var(--space-12);
    }

    /* ---------- Card ---------- */
    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-elevated);
      padding: var(--space-8);
      margin-bottom: var(--space-6);
    }
    .card-title {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: -0.22px;
      line-height: 1.1;
      color: var(--color-heading);
      margin-bottom: var(--space-8);
    }
    .section-rule { margin-top: var(--space-8); }

    /* ---------- Form ---------- */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-6) var(--space-8);
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      min-width: 0;
    }
    .form-group label {
      font-size: 14px;
      font-weight: 400;
      color: var(--color-label);
    }
    .input-wrapper {
      display: flex;
      align-items: center;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      transition: border-color 0.15s, box-shadow 0.15s;
      background: var(--color-surface);
    }
    .input-wrapper:focus-within {
      border-color: var(--color-accent);
      box-shadow: var(--focus-ring);
    }
    .input-wrapper input,
    .input-wrapper select {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      padding: 10px 12px;
      font-family: var(--font-sans);
      font-feature-settings: "tnum";
      font-size: 16px;
      font-weight: 300;
      background: transparent;
      color: var(--color-heading);
    }
    .input-wrapper input::placeholder {
      color: var(--color-body);
      font-weight: 300;
    }
    .input-wrapper select {
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }
    .input-wrapper .unit {
      padding: 0 12px;
      font-size: 13px;
      font-weight: 300;
      color: var(--color-body);
      background: var(--color-surface-alt);
      height: 100%;
      display: flex;
      align-items: center;
      border-left: 1px solid var(--color-border);
      white-space: nowrap;
      min-height: 42px;
    }

    /* ---------- Buttons ---------- */
    .btn-row {
      margin-top: var(--space-8);
      display: flex;
      gap: var(--space-4);
    }
    .btn {
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      font-family: var(--font-sans);
      font-feature-settings: "ss01";
      font-size: 16px;
      font-weight: 400;
      line-height: 1;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .btn-primary {
      background: var(--color-accent);
      color: #ffffff;
      border: 1px solid var(--color-accent);
    }
    .btn-primary:hover {
      background: var(--color-accent-hover);
      border-color: var(--color-accent-hover);
    }
    .btn-primary:active { transform: scale(0.985); }
    .btn-ghost {
      background: transparent;
      color: var(--color-accent);
      border: 1px solid var(--color-accent-soft);
    }
    .btn-ghost:hover { background: var(--color-accent-wash); }

    /* ---------- Results ---------- */
    .results { display: none; }
    .results.show {
      display: block;
      animation: rise 0.3s cubic-bezier(0.2, 0, 0.2, 1);
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ---------- Summary ---------- */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-4);
      margin-bottom: var(--space-8);
    }
    .summary-item {
      padding: var(--space-6) var(--space-5);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-surface-alt);
      min-width: 0;
    }
    .summary-item .label {
      font-size: 13px;
      font-weight: 400;
      color: var(--color-body);
      margin-bottom: var(--space-3);
    }
    .summary-item .value {
      font-size: 26px;
      font-weight: 300;
      letter-spacing: -0.26px;
      line-height: 1.12;
      color: var(--color-heading);
      font-feature-settings: "tnum";
      font-variant-numeric: tabular-nums;
      word-break: break-word;
    }
    .summary-item .value .currency {
      font-size: 13px;
      font-weight: 300;
      color: var(--color-body);
      margin-left: 3px;
    }
    .summary-item .sub {
      font-size: 12px;
      font-weight: 300;
      color: var(--color-body);
      margin-top: var(--space-2);
      font-feature-settings: "tnum";
    }
    .summary-item.accent {
      background: var(--color-accent-wash);
      border-color: var(--color-accent-soft);
    }
    .summary-item.accent .value { color: var(--color-accent); }

    /* ---------- Table ---------- */
    .table-wrapper {
      max-height: 480px;
      overflow-y: auto;
      overflow-x: auto;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      -webkit-overflow-scrolling: touch;
    }
    .table-wrapper::-webkit-scrollbar { width: 8px; height: 8px; }
    .table-wrapper::-webkit-scrollbar-track { background: var(--color-surface-alt); }
    .table-wrapper::-webkit-scrollbar-thumb {
      background: var(--color-border-strong);
      border-radius: var(--radius-sm);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      font-feature-settings: "tnum";
      font-variant-numeric: tabular-nums;
      table-layout: fixed;
    }
    thead { position: sticky; top: 0; z-index: 1; }
    thead th {
      background: var(--color-surface-alt);
      color: var(--color-label);
      padding: 10px 8px;
      font-size: 12px;
      font-weight: 400;
      text-align: right;
      white-space: nowrap;
      border-bottom: 1px solid var(--color-border);
      overflow: hidden;
      text-overflow: ellipsis;
    }
    thead th:first-child { text-align: center; width: 56px; }
    tbody td {
      padding: 9px 8px;
      text-align: right;
      font-weight: 300;
      color: var(--color-heading);
      border-bottom: 1px solid var(--color-border);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    tbody td:first-child {
      text-align: center;
      color: var(--color-body);
      font-size: 13px;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--color-accent-wash); }

    /* ---------- Notice ---------- */
    .notice {
      margin-top: var(--space-6);
      padding: var(--space-5);
      background: var(--color-surface-alt);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 300;
      line-height: 1.6;
      color: var(--color-body);
    }
    .notice strong {
      font-weight: 400;
      color: var(--color-label);
    }

    /* ---------- Footer ---------- */
    .footer {
      border-top: 1px solid var(--color-border);
      padding: var(--space-8) var(--space-6);
      text-align: center;
      font-size: 12px;
      font-weight: 300;
      color: var(--color-body);
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 1024px) {
      .hero h1 { font-size: 40px; letter-spacing: -0.8px; }
    }
    @media (max-width: 640px) {
      .nav-inner { padding: var(--space-3) var(--space-5); }
      .nav-brand .sub { display: none; }
      .hero { padding: var(--space-8) var(--space-5) var(--space-6); }
      .hero h1 { font-size: 32px; letter-spacing: -0.64px; }
      .hero p { font-size: 16px; }
      .container { padding: 0 var(--space-5) var(--space-8); }
      .card { padding: var(--space-6) var(--space-5); }
      .card-title { font-size: 20px; margin-bottom: var(--space-6); }
      .form-grid { grid-template-columns: 1fr; gap: var(--space-5); }
      .summary-grid { grid-template-columns: 1fr; }
      .summary-item .value { font-size: 22px; }
      .btn-row { flex-direction: column; }
      .btn { width: 100%; text-align: center; }
      table { font-size: 13px; }
      thead th { padding: 9px 6px; font-size: 11px; }
      tbody td { padding: 8px 6px; font-size: 13px; }
      thead th:first-child { width: 44px; }
      .notice { font-size: 12px; }
    }
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <div class="nav-brand">
      <span class="mark">车贷计算器</span>
      <span class="sub">等额本息 · 等额本金</span>
    </div>
    <span class="nav-tag">Calculator</span>
  </div>
</nav>

<header class="hero">
  <h1>算清每一期<br>还多少、剩多少</h1>
  <p>输入贷款金额、期限与年利率，得到逐月还款明细。支持等额本息与等额本金两种方式，并可按提前还款月数查看已还金额与剩余本金。</p>
</header>

<div class="container">

  <!-- Input -->
  <section class="card">
    <h2 class="card-title">贷款参数</h2>
    <div class="form-grid">
      <div class="form-group">
        <label for="loanAmount">贷款金额</label>
        <div class="input-wrapper">
          <input type="text" id="loanAmount" placeholder="请输入贷款金额" value="10">
          <span class="unit">万元</span>
        </div>
      </div>
      <div class="form-group">
        <label for="loanMonths">贷款期限</label>
        <div class="input-wrapper">
          <input type="text" id="loanMonths" placeholder="1-360" value="36">
          <span class="unit">月</span>
        </div>
      </div>
      <div class="form-group">
        <label for="annualRate">贷款年利率</label>
        <div class="input-wrapper">
          <input type="text" id="annualRate" placeholder="请输入年利率" value="3.5">
          <span class="unit">%</span>
        </div>
      </div>
      <div class="form-group">
        <label for="prepayMonths">提前还款月数</label>
        <div class="input-wrapper">
          <input type="text" id="prepayMonths" placeholder="0 表示不提前还款" value="0">
          <span class="unit">月</span>
        </div>
      </div>
      <div class="form-group">
        <label for="repayType">还款方式</label>
        <div class="input-wrapper">
          <select id="repayType">
            <option value="debx" selected>等额本息还款</option>
            <option value="debj">等额本金还款</option>
          </select>
        </div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="calculate()">开始计算</button>
      <button class="btn btn-ghost" onclick="resetForm()">重新填写</button>
    </div>
  </section>

  <!-- Results -->
  <section class="card results" id="resultsCard">
    <h2 class="card-title">计算结果</h2>

    <div class="summary-grid">
      <div class="summary-item">
        <div class="label" id="monthlyLabel">每月月供</div>
        <div class="value" id="monthlyPayment">—</div>
      </div>
      <div class="summary-item">
        <div class="label">已还款总额</div>
        <div class="value" id="totalPayment">—</div>
      </div>
      <div class="summary-item">
        <div class="label">已还利息总额</div>
        <div class="value" id="totalInterest">—</div>
      </div>
      <div class="summary-item accent" style="grid-column: 1 / -1;">
        <div class="label">剩余本金</div>
        <div class="value" id="remainingPrincipal">—</div>
      </div>
    </div>

    <h2 class="card-title section-rule">还款明细表</h2>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>期数</th>
            <th id="thMonthly">月供金额</th>
            <th>月供本金</th>
            <th>月供利息</th>
            <th>剩余本金</th>
          </tr>
        </thead>
        <tbody id="scheduleBody"></tbody>
      </table>
    </div>

    <div class="notice">
      <strong>温馨提示</strong>　以上计算结果仅供参考，具体以办理业务或交易实际结果为准，据此投资风险自负。
    </div>
  </section>

</div>

<footer class="footer">
  车贷计算器 · 数据仅供参考
</footer>

<script>
function formatMoney(n) {
  return n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function formatSummary(n) {
  return formatMoney(n) + '<span class="currency">元</span>';
}

function validate(amount, months, rate) {
  if (isNaN(amount) || amount <= 0) { alert('请输入有效的贷款金额'); return false; }
  if (isNaN(months) || months < 1 || months > 360 || months !== Math.floor(months)) {
    alert('贷款期限请输入1-360的整数'); return false;
  }
  if (isNaN(rate) || rate <= 0 || rate > 100) { alert('请输入有效的年利率'); return false; }
  return true;
}

function calcDEBX(principal, months, monthlyRate) {
  if (monthlyRate === 0) {
    const mp = principal / months;
    const schedule = [];
    let remaining = principal;
    for (let i = 1; i <= months; i++) {
      remaining -= mp;
      schedule.push({ period: i, payment: mp, principal: mp, interest: 0, remaining: Math.max(0, remaining) });
    }
    return { monthlyPayment: mp, totalPayment: principal, totalInterest: 0, schedule };
  }
  const factor = Math.pow(1 + monthlyRate, months);
  const mp = principal * monthlyRate * factor / (factor - 1);
  const totalPayment = mp * months;
  const totalInterest = totalPayment - principal;
  const schedule = [];
  let remaining = principal;
  for (let i = 1; i <= months; i++) {
    const iPart = remaining * monthlyRate;
    const pPart = mp - iPart;
    remaining -= pPart;
    schedule.push({ period: i, payment: mp, principal: pPart, interest: iPart, remaining: Math.max(0, remaining) });
  }
  return { monthlyPayment: mp, totalPayment, totalInterest, schedule };
}

function calcDEBJ(principal, months, monthlyRate) {
  const monthlyPrincipal = principal / months;
  const schedule = [];
  let remaining = principal;
  let totalPayment = 0;
  let totalInterest = 0;
  for (let i = 1; i <= months; i++) {
    const iPart = remaining * monthlyRate;
    const mp = monthlyPrincipal + iPart;
    remaining -= monthlyPrincipal;
    totalPayment += mp;
    totalInterest += iPart;
    schedule.push({
      period: i, payment: mp, principal: monthlyPrincipal,
      interest: iPart, remaining: Math.max(0, remaining)
    });
  }
  return {
    monthlyPayment: schedule[0].payment, totalPayment, totalInterest, schedule,
    firstMonth: schedule[0].payment, lastMonth: schedule[schedule.length - 1].payment
  };
}

function calculate() {
  const amount = parseFloat(document.getElementById('loanAmount').value.replace(/,/g, '')) * 10000;
  const months = parseInt(document.getElementById('loanMonths').value);
  const rate = parseFloat(document.getElementById('annualRate').value);
  const type = document.getElementById('repayType').value;

  if (!validate(amount / 10000, months, rate)) return;

  const monthlyRate = rate / 100 / 12;
  let result;

  if (type === 'debx') {
    result = calcDEBX(amount, months, monthlyRate);
    document.getElementById('monthlyLabel').textContent = '每月月供';
    document.getElementById('monthlyPayment').innerHTML = formatSummary(result.monthlyPayment);
    document.getElementById('thMonthly').textContent = '月供金额';
  } else {
    result = calcDEBJ(amount, months, monthlyRate);
    document.getElementById('monthlyLabel').textContent = '首月月供';
    document.getElementById('monthlyPayment').innerHTML =
      formatSummary(result.firstMonth) +
      '<div class="sub">末月 ' + formatMoney(result.lastMonth) + ' 元</div>';
    document.getElementById('thMonthly').textContent = '月供金额';
  }

  // 提前还款：0 或留空表示不提前还款，按全期统计
  const prepayNum = parseInt(document.getElementById('prepayMonths').value);
  const pIdx = (isNaN(prepayNum) || prepayNum <= 0)
    ? result.schedule.length
    : Math.min(prepayNum, result.schedule.length);

  let paidTotal = 0, paidInterest = 0;
  for (let i = 0; i < pIdx; i++) {
    paidTotal += result.schedule[i].payment;
    paidInterest += result.schedule[i].interest;
  }
  const remaining = result.schedule[pIdx - 1] ? result.schedule[pIdx - 1].remaining : amount;

  document.getElementById('totalPayment').innerHTML = formatSummary(paidTotal);
  document.getElementById('totalInterest').innerHTML = formatSummary(paidInterest);
  document.getElementById('remainingPrincipal').innerHTML = formatSummary(remaining);

  const tbody = document.getElementById('scheduleBody');
  tbody.innerHTML = '';
  const frag = document.createDocumentFragment();
  result.schedule.forEach(row => {
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td>' + row.period + '</td>' +
      '<td>' + formatMoney(row.payment) + '</td>' +
      '<td>' + formatMoney(row.principal) + '</td>' +
      '<td>' + formatMoney(row.interest) + '</td>' +
      '<td>' + formatMoney(row.remaining) + '</td>';
    frag.appendChild(tr);
  });
  tbody.appendChild(frag);

  document.getElementById('resultsCard').classList.add('show');
  document.getElementById('resultsCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function resetForm() {
  document.getElementById('loanAmount').value = '';
  document.getElementById('loanMonths').value = '';
  document.getElementById('annualRate').value = '';
  document.getElementById('prepayMonths').value = '0';
  document.getElementById('repayType').value = 'debx';
  document.getElementById('resultsCard').classList.remove('show');
  document.getElementById('loanAmount').focus();
}

document.getElementById('loanAmount').addEventListener('blur', function() {
  const v = parseFloat(this.value.replace(/,/g, ''));
  if (!isNaN(v) && v > 0) {
    this.value = v.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }
});

document.addEventListener('keydown', function(e) {

});
